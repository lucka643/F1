name: Prepare ray tracing tools
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/prepare-raytracing.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir ray-tools && cd ray-tools
          npm pack three-gpu-pathtracer@0.0.24
          npm view three-gpu-pathtracer@0.0.24 peerDependencies --json > peer-dependencies.json
      - uses: actions/upload-artifact@v4
        with:
          name: ray-tools
          path: ray-tools/
          retention-days: 3
